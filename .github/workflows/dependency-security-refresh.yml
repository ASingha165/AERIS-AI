name: AERIS-AI dependency security refresh

on:
  push:
    branches:
      - fix/next-security-and-release-readiness

permissions:
  contents: write

jobs:
  refresh-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Upgrade Next.js to patched 15.0 release
        run: npm install --save-exact next@15.0.8 eslint-config-next@15.0.8 --no-fund --no-progress

      - name: Apply non-breaking dependency security fixes
        run: npm audit fix --no-fund --no-progress || true

      - name: Report remaining dependency advisories
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const a=require('./npm-audit-report.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2))"

      - name: Run TypeScript checks
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Commit refreshed dependency lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifests are already current."
          else
            git commit -m "fix: patch Next.js and refresh vulnerable dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
